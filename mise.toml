[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
node = "22.23.4"
task = "3.51.1"
# trunk launcher; the linter CLI version is pinned in .trunk/trunk.yaml
trunk = "1.3.4"
changie = "1.24.2"
helm = "4.3.0"
# must match the wasm-bindgen crate pinned in Cargo.toml
"github:wasm-bindgen/wasm-bindgen" = { version = "0.2.129", bin = "wasm-bindgen" }
# must match the astro package pinned in web/package.json
"npm:astro" = "7.4.11"
