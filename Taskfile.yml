version: '3'

vars:
  # Site the web build renders; the root Taskfile points it at the instance.
  TAAC_SITE: '{{.TAAC_SITE | default (printf "%s/examples/demo/site.yaml" .TASKFILE_DIR)}}'

env:
  TAAC_SITE: '{{.TAAC_SITE}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install Node dependencies
    cmds:
      - npm ci

  wasm:
    desc: Build the Rust core to WebAssembly into packages/core/pkg
    sources:
      - Cargo.toml
      - Cargo.lock
      - crates/**/*.rs
      - crates/**/Cargo.toml
    generates:
      - packages/core/pkg/taac_bg.wasm
    cmds:
      - cargo build -p taac-wasm --target wasm32-unknown-unknown --release
      - wasm-bindgen --target web --out-dir packages/core/pkg --out-name taac target/wasm32-unknown-unknown/release/taac_wasm.wasm

  cli:
    desc: Build the taac CLI (release)
    cmds:
      - cargo build --release -p taac-cli

  plugins:
    desc: Build Extism WebAssembly plugins into plugins/dist
    sources:
      - crates/taac-plugin-api/**/*.rs
      - crates/taac-plugin-api/Cargo.toml
      - plugins/transitous/**/*.rs
      - plugins/transitous/Cargo.toml
      - plugins/transitous/Cargo.lock
    generates:
      - plugins/dist/transitous.wasm
    cmds:
      - cargo build --manifest-path plugins/transitous/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - mkdir -p plugins/dist
      - cp plugins/transitous/target/wasm32-unknown-unknown/release/taac_plugin_transitous.wasm plugins/dist/transitous.wasm

  plugins:fmt:
    desc: Check Rust formatting for plugins
    cmds:
      - cargo fmt --manifest-path plugins/transitous/Cargo.toml -- --check

  plugins:lint:
    desc: Lint plugins with clippy (warnings are errors)
    cmds:
      - cargo clippy --manifest-path plugins/transitous/Cargo.toml --all-targets --locked -- -D warnings
      - cargo clippy --manifest-path plugins/transitous/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

  plugins:test:
    desc: Run plugin unit tests
    cmds:
      - cargo test --manifest-path plugins/transitous/Cargo.toml --locked

  schema:
    desc: Regenerate the JSON Schemas in schema/
    cmds:
      - cargo run -q -p taac-cli -- schema --out schema

  schema:check:
    desc: Fail if the committed JSON Schemas are stale
    cmds:
      - task: schema
      - git diff --exit-code -- schema

  rust:fmt:
    desc: Check Rust formatting
    cmds:
      - cargo fmt --all -- --check

  rust:lint:
    desc: Lint Rust with clippy (warnings are errors)
    cmds:
      - cargo clippy --all-targets --locked -- -D warnings

  rust:test:
    desc: Run the Rust test suite
    cmds:
      - cargo test --locked

  web:dev:
    desc: Run the website in development mode against TAAC_SITE
    deps: [wasm]
    cmds:
      - npm run dev -w @taac/web

  web:build:
    desc: Build the static website for TAAC_SITE into web/dist
    deps: [wasm]
    cmds:
      - npm run build -w @taac/web

  web:check:
    desc: Type-check the website (astro check)
    deps: [wasm]
    cmds:
      - npm run typecheck -w @taac/web

  server:check:
    desc: Type-check the server
    cmds:
      - npm run typecheck -w @taac/server

  chart:check:
    desc: Lint the Helm chart
    cmds:
      - helm lint --strict deploy/helm/taac

  server:build:
    desc: Bundle the server into server/dist/main.mjs
    cmds:
      - npm run build -w @taac/server

  lint:
    desc: Lint TypeScript, JavaScript and Astro with eslint
    cmds:
      - npm run lint

  test:
    desc: Run the Rust and TypeScript test suites
    cmds:
      - task: rust:test
      - npx vitest run

  build:
    desc: Build the website
    cmds:
      - task: web:build

  verify:
    desc: The full CI mirror — format, lint, tests, schemas, type checks, build
    cmds:
      - task: plugins
      - task: plugins:fmt
      - task: plugins:lint
      - task: plugins:test
      - task: rust:fmt
      - task: rust:lint
      - task: rust:test
      - task: schema:check
      - task: lint
      - task: web:check
      - task: server:check
      - task: chart:check
      - npx vitest run
      - task: build
