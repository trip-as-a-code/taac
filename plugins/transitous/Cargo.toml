[package]
name = "taac-plugin-transitous"
description = "Extism route-provider plugin for taac backed by the Transitous (MOTIS 2) API"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/trip-as-a-code/taac"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taac-plugin-api = { path = "../../crates/taac-plugin-api" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
