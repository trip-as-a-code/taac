{{- if .Values.database.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "taac.fullname" . }}-db
  labels:
    {{- include "taac.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.cnpg.instances }}
  storage:
    size: {{ .Values.database.cnpg.storage.size }}
    {{- with .Values.database.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: taac
      owner: taac
{{- end }}
