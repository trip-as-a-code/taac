# yaml-language-server: $schema=../../../schema/trip.v1alpha4.json
apiVersion: taac/v1alpha4
kind: Trip
metadata:
  title: Lisbon Long Weekend
  summary: Tiles, trams and pastéis de nata — three days on the Tagus.
  locale: en
  timezone: Europe/Lisbon
  cover: { emoji: 🚋, hue: 28 }
  tags: [city, food]
currency:
  base: EUR
members:
  - { name: Alex }
  - { name: Sam }
  - { name: Robin, currency: USD } # pays in dollars
groups:
  - name: Early birds
    emoji: 🌅
    members: [Alex, Sam]
bases:
  - { title: Lisbon, place: Lisbon, from: 2027-05-14, to: 2027-05-16 }
# Plans, bases and ideas refer to places by these names.
places:
  Lisbon: { geo: [38.7223, -9.1393], category: city, radius: 12000 }
  # An area (it has a `radius`): getting around inside it is local.
  Sintra: { geo: [38.7930, -9.3880], category: historic, radius: 5000 }
  Lisbon Airport (LIS): { geo: [38.7742, -9.1342], category: airport }
  London Gatwick (LGW): { geo: [51.1537, -0.1821], category: airport }
  Casa do Bairro: { geo: [38.7105, -9.1466], category: hotel, address: 'Rua da Rosa 12, Lisboa' }
  Castelo de São Jorge: { geo: [38.7139, -9.1335], category: historic, url: https://castelodesaojorge.pt }
  Pastéis de Belém: { geo: [38.6975, -9.2032], category: food }
  Jerónimos Monastery: { geo: [38.6979, -9.2068], category: historic }
  Pena Palace: { geo: [38.7876, -9.3906], category: historic }
  Rossio Station: { geo: [38.7142, -9.1410], category: station }
  Sintra Station: { geo: [38.7987, -9.3860], category: station }
  Cais do Sodré: { geo: [38.7058, -9.1445], category: station }
  # Trams, metro and buses board and leave at stops; the rest is a walk.
  Santa Luzia (Tram 28): { geo: [38.7116, -9.1305], category: stop }
  Baixa-Chiado: { geo: [38.7106, -9.1394], category: station }
  Belém (Tram 15E): { geo: [38.6973, -9.2058], category: stop }
  Pena (Bus 434): { geo: [38.789, -9.388], category: stop }
  Miradouro da Senhora do Monte: { geo: [38.7194, -9.1327], category: viewpoint }
itinerary:
  - kind: flight
    title: London → Lisbon
    who: [everyone]
    start: 2027-05-14T07:05:00+01:00
    end: 2027-05-14T09:50:00+01:00
    places: [London Gatwick (LGW), Lisbon Airport (LIS)]
    transport: { carrier: TAP Air Portugal, number: TP1337 }
    booking: { status: booked, provider: TAP, reference: { secret: DEMO_PNR } }
    costs:
      # Priced in pounds, charged to Alex's card in euros; the others still owe Alex.
      - {
          amount: 138,
          currency: GBP,
          paidBy: Alex,
          label: 3 tickets,
          charged: { amount: 161.46, currency: EUR },
          settled: false,
        }
  - kind: lodging
    title: Casa do Bairro
    who: [everyone]
    start: 2027-05-14T16:30:00+01:00
    end: 2027-05-17T11:00:00+01:00
    places: [Casa do Bairro]
    booking:
      {
        status: booked,
        provider: Booking.com,
        url: https://example.com/casa-do-bairro,
        reference: { secret: DEMO_HOTEL_REF },
      }
    costs:
      - { amount: 486, currency: EUR, paidBy: each } # everyone paid their own third
    contacts:
      - { name: Front desk, role: hotel, phone: { secret: DEMO_HOTEL_PHONE } }
  - kind: activity
    title: Tram 28 and the castle
    who: [everyone]
    start: 2027-05-14T12:00:00+01:00
    end: 2027-05-14T16:00:00+01:00
    places: [Castelo de São Jorge]
    booking: { status: required, deadline: 2027-05-01, url: https://castelodesaojorge.pt }
    costs:
      - { amount: 45, currency: EUR, estimate: true } # not paid yet: no payer, no debt
    notes: Buy castle tickets online to **skip the queue**. Tram 28 boards at Martim Moniz.
  - kind: activity
    title: Sunset at the miradouro
    date: 2027-05-14
    part: evening
    places: [Miradouro da Senhora do Monte]
    who: [Alex, Robin]
  # Outside the Lisbon area: a plan there needs the journeys there and back.
  - kind: train
    title: Rossio → Sintra
    who: [Early birds]
    start: 2027-05-15T08:11:00+01:00
    end: 2027-05-15T08:51:00+01:00
    places: [Rossio Station, Sintra Station]
  - kind: bus
    title: Bus 434 up to Pena
    who: [Early birds]
    start: 2027-05-15T08:55:00+01:00
    end: 2027-05-15T09:05:00+01:00
    places: [Sintra Station, Pena (Bus 434)]
    costs:
      - { amount: 7.6, currency: EUR, paidBy: each, label: 2 hop-on tickets }
  - kind: walk
    title: Up to the palace
    who: [Early birds]
    start: 2027-05-15T09:05:00+01:00
    end: 2027-05-15T09:15:00+01:00
    places: [Pena (Bus 434), Pena Palace]
  - kind: activity
    title: Day trip to Sintra
    start: 2027-05-15T09:15:00+01:00
    end: 2027-05-15T16:15:00+01:00
    who: [Early birds]
    places: [Pena Palace]
    booking: { status: required, deadline: 2027-04-20 }
    costs:
      - { amount: 64, currency: EUR, paidBy: Alex } # paid costs count as paid back unless `settled: false`
  - kind: walk
    title: Down through the old town
    who: [Early birds]
    start: 2027-05-15T16:15:00+01:00
    end: 2027-05-15T16:40:00+01:00
    places: [Pena Palace, Sintra Station]
  - kind: train
    title: Sintra → Rossio
    who: [Early birds]
    start: 2027-05-15T16:41:00+01:00
    end: 2027-05-15T17:21:00+01:00
    places: [Sintra Station, Rossio Station]
  # A rented bike along the river: the service is the carrier.
  - kind: ride
    title: Along the river to Belém
    who: [everyone]
    start: 2027-05-16T09:15:00+01:00
    end: 2027-05-16T09:50:00+01:00
    places: [Cais do Sodré, Pastéis de Belém]
    transport: { vehicle: bicycle, carrier: GIRA }
    costs:
      - { amount: 6, currency: EUR, paidBy: each, estimate: true, label: day passes }
  - kind: meal
    title: Pastéis de nata in Belém
    who: [everyone]
    start: 2027-05-16T10:00:00+01:00
    end: 2027-05-16T11:00:00+01:00
    places: [Pastéis de Belém, Jerónimos Monastery]
    costs:
      - { amount: 18.6, currency: EUR, paidBy: Robin, split: { shares: { Alex: 1, Sam: 1, Robin: 2 } }, settled: false }
  - kind: flight
    title: Lisbon → London
    who: [everyone]
    start: 2027-05-17T18:40:00+01:00
    end: 2027-05-17T21:15:00+01:00
    places: [Lisbon Airport (LIS), London Gatwick (LGW)]
    transport: { carrier: TAP Air Portugal, number: TP1338 }
    booking: { status: booked, reference: { secret: DEMO_PNR } }
  # Every move between two places is a leg: rides between stops, walks to and from them.
  # The Viva Viagem pass pays the fares.
  - kind: train
    title: Metro and Tram 28 to the castle
    who: [everyone]
    start: 2027-05-14T10:30:00+01:00
    end: 2027-05-14T11:40:00+01:00
    places: [Lisbon Airport (LIS), Santa Luzia (Tram 28)]
    transport: { carrier: Metro / Carris }
  - kind: walk
    title: Up to the castle
    who: [everyone]
    start: 2027-05-14T11:40:00+01:00
    end: 2027-05-14T11:55:00+01:00
    places: [Santa Luzia (Tram 28), Castelo de São Jorge]
  - kind: walk
    title: Down to Casa do Bairro
    who: [everyone]
    start: 2027-05-14T16:00:00+01:00
    end: 2027-05-14T16:25:00+01:00
    places: [Castelo de São Jorge, Casa do Bairro]
  - kind: walk
    title: Up to the miradouro
    who: [Alex, Robin]
    start: 2027-05-14T18:30:00+01:00
    end: 2027-05-14T18:55:00+01:00
    places: [Casa do Bairro, Miradouro da Senhora do Monte]
  - kind: walk
    title: Back to Casa do Bairro
    who: [Alex, Robin]
    start: 2027-05-14T21:30:00+01:00
    end: 2027-05-14T21:55:00+01:00
    places: [Miradouro da Senhora do Monte, Casa do Bairro]
  - kind: walk
    title: To Rossio
    who: [Early birds]
    start: 2027-05-15T07:50:00+01:00
    end: 2027-05-15T08:05:00+01:00
    places: [Casa do Bairro, Rossio Station]
  - kind: walk
    title: Rossio to Casa do Bairro
    who: [Early birds]
    start: 2027-05-15T17:25:00+01:00
    end: 2027-05-15T17:40:00+01:00
    places: [Rossio Station, Casa do Bairro]
  - kind: walk
    title: Down to Cais do Sodré
    who: [everyone]
    start: 2027-05-16T08:50:00+01:00
    end: 2027-05-16T09:10:00+01:00
    places: [Casa do Bairro, Cais do Sodré]
  - kind: walk
    title: To the tram
    who: [everyone]
    start: 2027-05-16T11:05:00+01:00
    end: 2027-05-16T11:10:00+01:00
    places: [Jerónimos Monastery, Belém (Tram 15E)]
  - kind: train
    title: Tram 15E back from Belém
    who: [everyone]
    start: 2027-05-16T11:12:00+01:00
    end: 2027-05-16T11:35:00+01:00
    places: [Belém (Tram 15E), Cais do Sodré]
    transport: { carrier: Carris }
  - kind: walk
    title: Up to Casa do Bairro
    who: [everyone]
    start: 2027-05-16T11:35:00+01:00
    end: 2027-05-16T11:55:00+01:00
    places: [Cais do Sodré, Casa do Bairro]
  - kind: walk
    title: To Baixa-Chiado
    who: [everyone]
    start: 2027-05-17T16:20:00+01:00
    end: 2027-05-17T16:30:00+01:00
    places: [Casa do Bairro, Baixa-Chiado]
  - kind: train
    title: Metro to the airport
    who: [everyone]
    start: 2027-05-17T16:32:00+01:00
    end: 2027-05-17T17:10:00+01:00
    places: [Baixa-Chiado, Lisbon Airport (LIS)]
    transport: { carrier: Metro de Lisboa }
ideas:
  - title: LX Factory market
    who: [everyone]
    area: Lisbon
    places: [{ name: LX Factory, geo: [38.7036, -9.1784], category: shopping }]
    duration: halfDay
    notes: Sunday market; bookshop in an old printing hall.
  # Two options for one evening: compared side by side, only the cheaper counts as possible spend.
  - title: Fado at Clube de Fado
    kind: meal
    who: [everyone]
    option: Fado dinner
    area: Lisbon
    date: 2027-05-16
    part: evening
    priority: must
    booking: { status: required, deadline: 2027-05-09, url: https://example.com/clube-de-fado }
    costs: [{ amount: 120, currency: EUR, estimate: true }]
  - title: Fado at Tasca do Chico
    kind: meal
    who: [everyone]
    option: Fado dinner
    area: Lisbon
    date: 2027-05-16
    part: evening
    booking: { status: notRequired }
    costs: [{ amount: 60, currency: EUR, estimate: true }]
# Pays the metro, trams and buses of the legs in Lisbon on these days.
passes:
  - title: Viva Viagem day passes
    area: Lisbon
    periods: [{ from: 2027-05-14, to: 2027-05-17 }]
    provider: Carris / Metro de Lisboa
    url: https://www.carris.pt
    costs:
      - { amount: 84, currency: EUR, paidBy: each, estimate: true, label: 3 × 4 days }
tasks:
  - title: Renew passport
    who: [Robin]
    required: true
    done: 2027-03-02
  - title: Book the Sintra palace slots
    due: 2027-05-01
  - title: Buy Viva Viagem cards
    who: [Early birds]
    due: 2027-05-14
  - title: Split the shared bills
    due: 2027-05-20
packing:
  - category: Essentials
    items:
      - Passport
      - Euros (cards work almost everywhere)
      - { name: Camera, who: [Sam] }
      - name: Travel adapter
        who: [Alex]
        costs: [{ amount: 15, currency: EUR }] # still to buy
      - name: Waterproof phone pouch
        bought: true
        costs: [{ amount: 24, currency: EUR, paidBy: Sam, label: 3-pack }]
  - category: Clothes
    items:
      - { name: Comfortable walking shoes, bag: suitcase, notes: The hills are steep. }
      - { name: Light jacket, bag: carry-on, notes: For the evenings by the river. }
      - { name: T-shirts, qty: 4, bag: suitcase }
