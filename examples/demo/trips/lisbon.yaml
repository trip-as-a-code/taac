# yaml-language-server: $schema=../../../schema/trip.v1alpha4.json
apiVersion: taac/v1alpha4
kind: Trip
metadata:
  title: Lisbon Long Weekend
  summary: Tiles, trams and pastéis de nata — three days on the Tagus.
  locale: en
  timezone: Europe/Lisbon
  cover: { emoji: 🚋, hue: 28 }
  tags: [city, food]
currency:
  base: EUR
members:
  - { name: Alex }
  - { name: Sam }
  - { name: Robin, currency: USD } # pays in dollars
groups:
  - name: Early birds
    emoji: 🌅
    members: [Alex, Sam]
bases:
  - { title: Lisbon, place: Lisbon, from: 2027-05-14, to: 2027-05-16 }
# Plans, bases and ideas refer to places by these names.
places:
  Lisbon: { geo: [38.7223, -9.1393], category: city, radius: 12000 }
  Lisbon Airport (LIS): { geo: [38.7742, -9.1342], category: airport }
  London Gatwick (LGW): { geo: [51.1537, -0.1821], category: airport }
  Casa do Bairro: { geo: [38.7105, -9.1466], category: hotel, address: 'Rua da Rosa 12, Lisboa' }
  Castelo de São Jorge: { geo: [38.7139, -9.1335], category: historic, url: https://castelodesaojorge.pt }
  Pastéis de Belém: { geo: [38.6975, -9.2032], category: food }
  Jerónimos Monastery: { geo: [38.6979, -9.2068], category: historic }
  Pena Palace: { geo: [38.7876, -9.3906], category: historic }
  Miradouro da Senhora do Monte: { geo: [38.7194, -9.1327], category: viewpoint }
itinerary:
  - kind: flight
    title: London → Lisbon
    who: [everyone]
    start: 2027-05-14T07:05:00+01:00
    end: 2027-05-14T09:50:00+01:00
    places: [London Gatwick (LGW), Lisbon Airport (LIS)]
    transport: { carrier: TAP Air Portugal, number: TP1337 }
    booking: { status: booked, provider: TAP, reference: { secret: DEMO_PNR } }
    costs:
      # Priced in pounds, charged to Alex's card in euros; the others still owe Alex.
      - {
          amount: 138,
          currency: GBP,
          paidBy: Alex,
          label: 3 tickets,
          charged: { amount: 161.46, currency: EUR },
          settled: false,
        }
  - kind: lodging
    title: Casa do Bairro
    who: [everyone]
    start: 2027-05-14T15:00:00+01:00
    end: 2027-05-17T11:00:00+01:00
    places: [Casa do Bairro]
    booking:
      {
        status: booked,
        provider: Booking.com,
        url: https://example.com/casa-do-bairro,
        reference: { secret: DEMO_HOTEL_REF },
      }
    costs:
      - { amount: 486, currency: EUR, paidBy: each } # everyone paid their own third
    contacts:
      - { name: Front desk, role: hotel, phone: { secret: DEMO_HOTEL_PHONE } }
  - kind: activity
    title: Tram 28 and the castle
    who: [everyone]
    start: 2027-05-14T12:00:00+01:00
    end: 2027-05-14T16:00:00+01:00
    places: [Castelo de São Jorge]
    booking: { status: required, deadline: 2027-05-01, url: https://castelodesaojorge.pt }
    costs:
      - { amount: 45, currency: EUR, estimate: true } # not paid yet: no payer, no debt
    notes: Buy castle tickets online to **skip the queue**. Tram 28 boards at Martim Moniz.
  - kind: activity
    title: Sunset at the miradouro
    date: 2027-05-14
    part: evening
    places: [Miradouro da Senhora do Monte]
    who: [Alex, Robin]
  - kind: activity
    title: Day trip to Sintra
    start: 2027-05-15T08:30:00+01:00
    end: 2027-05-15T17:00:00+01:00
    who: [Early birds]
    places: [Pena Palace]
    booking: { status: required, deadline: 2027-04-20 }
    costs:
      - { amount: 64, currency: EUR, paidBy: Alex } # paid costs count as paid back unless `settled: false`
  - kind: meal
    title: Pastéis de nata in Belém
    who: [everyone]
    start: 2027-05-16T10:00:00+01:00
    end: 2027-05-16T11:00:00+01:00
    places: [Pastéis de Belém, Jerónimos Monastery]
    costs:
      - { amount: 18.6, currency: EUR, paidBy: Robin, split: { shares: { Alex: 1, Sam: 1, Robin: 2 } }, settled: false }
  - kind: flight
    title: Lisbon → London
    who: [everyone]
    start: 2027-05-17T18:40:00+01:00
    end: 2027-05-17T21:15:00+01:00
    places: [Lisbon Airport (LIS), London Gatwick (LGW)]
    transport: { carrier: TAP Air Portugal, number: TP1338 }
    booking: { status: booked, reference: { secret: DEMO_PNR } }
ideas:
  - title: LX Factory market
    who: [everyone]
    area: Lisbon
    places: [{ name: LX Factory, geo: [38.7036, -9.1784], category: shopping }]
    duration: halfDay
    notes: Sunday market; bookshop in an old printing hall.
  # Two options for one evening: compared side by side, only the cheaper counts as possible spend.
  - title: Fado at Clube de Fado
    kind: meal
    who: [everyone]
    option: Fado dinner
    area: Lisbon
    date: 2027-05-16
    part: evening
    priority: must
    booking: { status: required, deadline: 2027-05-09, url: https://example.com/clube-de-fado }
    costs: [{ amount: 120, currency: EUR, estimate: true }]
  - title: Fado at Tasca do Chico
    kind: meal
    who: [everyone]
    option: Fado dinner
    area: Lisbon
    date: 2027-05-16
    part: evening
    booking: { status: notRequired }
    costs: [{ amount: 60, currency: EUR, estimate: true }]
packing:
  - category: Essentials
    items:
      - Passport
      - Euros (cards work almost everywhere)
      - { name: Camera, who: [Sam] }
      - name: Travel adapter
        who: [Alex]
        costs: [{ amount: 15, currency: EUR }] # still to buy
      - name: Waterproof phone pouch
        bought: true
        costs: [{ amount: 24, currency: EUR, paidBy: Sam, label: 3-pack }]
  - category: Clothes
    items:
      - { name: Comfortable walking shoes, bag: suitcase, notes: The hills are steep. }
      - { name: Light jacket, bag: carry-on, notes: For the evenings by the river. }
      - { name: T-shirts, qty: 4, bag: suitcase }
