name: Build and Push Site Image

# Reusable workflow for trip repositories to build and push their site image to GHCR.
on:
  workflow_call:
    inputs:
      taac-version:
        description: taac container image tag (e.g. 0.1.0, latest, main)
        required: false
        default: latest
        type: string
      dockerfile:
        description: Path to Dockerfile
        required: false
        default: Dockerfile
        type: string
      tag:
        description: Branch/channel tag to publish alongside the commit SHA
        required: false
        default: main
        type: string

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=${{ inputs.tag }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: |
            TAAC=ghcr.io/trip-as-a-code/taac
            TAAC_VERSION=${{ inputs.taac-version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - run: echo "site ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
