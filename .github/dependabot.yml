version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Delay proposing newly published releases to reduce exposure to
    # supply chain attacks that are caught/yanked shortly after release.
    cooldown:
      default-days: 14
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo-all:
        applies-to: version-updates
        patterns: ['*']
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # The crate must match the wasm-bindgen CLI pinned in mise.toml exactly;
      # bump both together by hand.
      - dependency-name: wasm-bindgen
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-all:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # typescript-eslint peers typescript <6.1; TS 7 (native compiler) is unsupported.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
