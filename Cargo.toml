[workspace]
resolver = "3"
members = ["crates/taac-core", "crates/taac-cli", "crates/taac-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/trip-as-a-code/taac"
rust-version = "1.88"

[workspace.dependencies]
taac-core = { path = "crates/taac-core" }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.6", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-float"] }
schemars = { version = "1.2", features = ["chrono04", "indexmap2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-saphyr = "1.3"
thiserror = "2.0"
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.taac-wasm]
opt-level = "s"
