# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.23.4
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
# Rust (rustfmt, clippy) and eslint run from the pinned toolchains
# (CI jobs and `task verify`): eslint needs the workspace's own plugins.
lint:
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.50.1
    - osv-scanner@2.7.1
    # .prettierrc loads the Astro plugin; trunk's sandbox needs it too.
    - prettier@3.10.1:
        packages:
          - prettier-plugin-astro@1.1.2
    - trufflehog@3.100.1
    - yamllint@1.38.0
  ignore:
    - linters:
        - ALL
      paths:
        - '**/node_modules/**'
        - '**/dist/**'
        - target/**
        - packages/core/pkg/**
        - web/.astro/**
        - .changes/**
        - CHANGELOG.md
    # Helm templates aren't YAML until rendered; `helm lint` checks them.
    - linters:
        - prettier
        - yamllint
      paths:
        - deploy/helm/*/templates/**
    # Generated by `taac schema`; CI checks them against the code instead.
    - linters:
        - prettier
      paths:
        - schema/**
    # Third-party map data, kept byte-for-byte.
    - linters:
        - ALL
      paths:
        - examples/**/overlays/**
    # The PR template opens with H2s, the issue templates with front matter, and the license is its standard text.
    - linters:
        - markdownlint
      paths:
        - .github/PULL_REQUEST_TEMPLATE.md
        - .github/ISSUE_TEMPLATE/**
        - LICENSE.md
actions:
  definitions:
    # The full CI mirror runs before anything leaves the machine; CI's job
    # is to double-check, not to discover.
    - id: verify-pre-push
      display_name: verify
      description: validation, lint, tests and a release build before push
      run: task verify
      triggers:
        - git_hooks: [pre-push]
  enabled:
    - commitlint
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
    - verify-pre-push
